<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org/">

<head>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<h1>Add new Product</h1>

<form th:action="@{/processForm}" th:object="${productModel}" method="post">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="form-group">
                    <h3>Add Product</h3>
                </div>

                <!-- Name -->
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" class="form-control" th:field="*{name}" placeholder="Enter product name">
                </div>

                <!-- Expiration Date -->
                <div class="form-group">
                    <label>Expiration Date</label>
                    <input type="text" class="form-control" th:field="*{expirationDate}" placeholder="dd/mm/yyyy">
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>

            </div>
        </div>
    </div>

</form>

</body>
</html>
